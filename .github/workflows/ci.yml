name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install uv (with Python 3.12)
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Cargo fmt
        run: cargo fmt --check

      - name: Cargo clippy
        run: cargo clippy -- -D warnings

      - name: Install Python deps
        run: uv sync

      # Builds and installs the hawk_core PyO3 extension into the venv.
      - name: Build Rust extension
        run: uv run maturin develop --release

      - name: Ruff (lint)
        run: uv run ruff check hawk/ example/

      - name: Ruff (format)
        run: uv run ruff format --check hawk/ example/
