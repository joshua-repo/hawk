[build-system]
requires = [
    "setuptools>=61.0",
    "wheel",
    "pybind11>=2.10",
]
build-backend = "setuptools.build_meta"

[project]
name = "hawk"
version = "1.0.0"
description = ""
authors = [
    { name = "Your Name", email = "your@email.com" }
]
requires-python = ">=3.10"
dependencies = [
    "pandas",
    "numpy",
]

[tool.setuptools]
package-dir = {"" = "src/python"}

[tool.setuptools.packages.find]
where = ["src/python"]
